# Mesma estrutura do projeto do professor, ajustada à porta do PostgreSQL local.
# Caso a sua instalação use outros dados, altere somente os valores à direita.
spring.application.name=concessionaria
spring.datasource.url=jdbc:postgresql://localhost:5432/concessionaria
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
